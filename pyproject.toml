[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rf-membership"
version = "0.1.0"
description = "Membership signal along the interpolation path of Flow Matching (training, MIA, lambda*_F)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "pytorch-lightning>=2.2",
    "timm>=0.9",
    "numpy",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "optuna",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
